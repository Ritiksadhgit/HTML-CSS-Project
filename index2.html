 <!-- doctype tells the browser which html version is used -->
<!DOCTYPE html>
<!-- lang attribute web page ki language batata he. -->
<html lang="en">
<head>
    <!-- utf 8 me special characters, symbols, emojjis or different languages ke letters support hote he -->
    <meta charset="UTF-8">
    <!-- website ko mobile friendly banata he -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- block tag-> h1....h6,p. takes full width.

     Block-level elements are HTML elements that start on a new line and usually take the full available width.

    inline tag-> i,u,b sub,sup,mark,strong,em,s. only takes required width.
    order list -> gives sequence.
    unorder list -> gives bullet points.
    atribute -> <opening tag attribute="value"></opening> it gives extra information about tag. -->
   <!-- 1,a, A,i,I. -->
    <ol type="I"> 
    <li>Apple</li>
    <li>mango</li>
    <li>banana</li>
 </ol>
  <!-- disc ,square, circle -->
 <ul type="circle"> 
    <li>apple</li>
    <li>mango</li>
    <li>banana</li>
 </ul>
